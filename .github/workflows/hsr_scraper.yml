name: HSR Auto Coupon Pipeline

on:
  schedule:
    # 00:00 UTC = 台灣時間 08:00
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  hsr_pipeline:
    runs-on: ubuntu-latest

    steps:

    # ================================================================
    # 1. Checkout
    # ================================================================

    - name: Checkout repository
      uses: actions/checkout@v4


    # ================================================================
    # 2. Python
    # ================================================================

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'


    # ================================================================
    # 3. Install dependencies
    # ================================================================

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4


    # ================================================================
    # 4. Main Pipeline
    # ================================================================

    - name: Scrape, Compare, Redeem and Log
      env:
        GAS_WEB_URL: ${{ secrets.HSR_GAS_WEB_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.HSR_DISCORD_WEBHOOK_URL }}
        ACCOUNTS_JSON: ${{ secrets.HSR_ACCOUNTS_JSON }}

      run: |
        python << 'EOF'

        import os
        import re
        import json
        import time
        import sys
        import requests
        from bs4 import BeautifulSoup


        # ============================================================
        # 設定
        # ============================================================

        GAS_WEB_URL = os.getenv(
            'GAS_WEB_URL',
            ''
        ).strip()

        DISCORD_WEBHOOK_URL = os.getenv(
            'DISCORD_WEBHOOK_URL',
            ''
        ).strip()

        ACCOUNTS_JSON = os.getenv(
            'ACCOUNTS_JSON',
            ''
        ).strip()


        SCRAPE_URL = (
            'https://www.crimsonwitch.com/'
            'codes/Honkai_Star_Rail'
        )


        EXCHANGE_API_URL = (
            'https://public-operation-hkrpg.hoyoverse.com/'
            'common/apicdkey/api/webExchangeCdkeyRisk'
        )


        # ============================================================
        # Discord
        # ============================================================

        def send_discord(message):

            if not DISCORD_WEBHOOK_URL:
                return

            try:

                response = requests.post(
                    DISCORD_WEBHOOK_URL,
                    json={
                        'content': message
                    },
                    timeout=15
                )

                print(
                    f'📡 Discord HTTP: '
                    f'{response.status_code}'
                )

            except Exception as e:

                print(
                    f'⚠️ Discord 通知失敗: {e}'
                )


        # ============================================================
        # Google Apps Script GET
        #
        # 這裡是這次主要修正的地方：
        #
        # 1. timeout 從 15 秒提高到 30 秒
        # 2. 最多重試 3 次
        # 3. 每次失敗等待
        # 4. 印出 HTTP status
        # 5. 印出回傳內容前 500 字
        # ============================================================

        def get_gas_data():

            max_attempts = 3

            for attempt in range(
                1,
                max_attempts + 1
            ):

                print()
                print(
                    f'📡 Google GAS GET '
                    f'第 {attempt}/{max_attempts} 次'
                )


                try:

                    response = requests.get(

                        GAS_WEB_URL,

                        params={
                            'action': 'getData'
                        },

                        timeout=30,

                        headers={
                            'User-Agent': (
                                'Mozilla/5.0 '
                                '(Windows NT 10.0; Win64; x64) '
                                'AppleWebKit/537.36 '
                                '(KHTML, like Gecko) '
                                'Chrome/120.0 Safari/537.36'
                            ),

                            'Accept': (
                                'application/json,'
                                'text/plain,*/*'
                            ),

                            'Cache-Control': 'no-cache'
                        },

                        allow_redirects=True

                    )


                    print(
                        f'📡 GAS HTTP Status: '
                        f'{response.status_code}'
                    )


                    print(
                        f'📡 GAS 最終 URL: '
                        f'{response.url}'
                    )


                    if response.status_code != 200:

                        print(
                            '⚠️ GAS HTTP 非 200：'
                            f'{response.status_code}'
                        )

                        print(
                            '📄 回應內容前 500 字：'
                        )

                        print(
                            response.text[:500]
                        )

                    else:

                        # ------------------------------------------------
                        # 嘗試 JSON
                        # ------------------------------------------------

                        try:

                            data = response.json()

                            print(
                                '✅ GAS JSON 讀取成功'
                            )

                            return data

                        except Exception as json_error:

                            print(
                                '❌ GAS HTTP 200，'
                                '但無法解析 JSON'
                            )

                            print(
                                f'JSON Error: '
                                f'{json_error}'
                            )

                            print(
                                '📄 回應內容前 1000 字：'
                            )

                            print(
                                response.text[:1000]
                            )


                except requests.exceptions.Timeout:

                    print(
                        '⏱️ GAS 請求逾時。'
                    )

                except requests.exceptions.ConnectionError as e:

                    print(
                        f'🔌 GAS 連線錯誤: {e}'
                    )

                except requests.exceptions.RequestException as e:

                    print(
                        f'❌ GAS Request 錯誤: {e}'
                    )

                except Exception as e:

                    print(
                        f'❌ GAS 未預期錯誤: {e}'
                    )


                # --------------------------------------------------------
                # Retry
                # --------------------------------------------------------

                if attempt < max_attempts:

                    wait_seconds = attempt * 5

                    print(
                        f'⏳ {wait_seconds} 秒後重試...'
                    )

                    time.sleep(
                        wait_seconds
                    )


            return None


        # ============================================================
        # Google Apps Script POST
        # ============================================================

        def post_gas(payload):

            max_attempts = 3

            for attempt in range(
                1,
                max_attempts + 1
            ):

                print(
                    f'📡 Google GAS POST '
                    f'第 {attempt}/{max_attempts} 次'
                )


                try:

                    response = requests.post(

                        GAS_WEB_URL,

                        json=payload,

                        timeout=30,

                        headers={
                            'User-Agent': (
                                'Mozilla/5.0 '
                                '(Windows NT 10.0; Win64; x64) '
                                'AppleWebKit/537.36 '
                                '(KHTML, like Gecko) '
                                'Chrome/120.0 Safari/537.36'
                            ),

                            'Accept': (
                                'application/json,'
                                'text/plain,*/*'
                            )
                        },

                        allow_redirects=True

                    )


                    print(
                        f'📡 GAS POST HTTP: '
                        f'{response.status_code}'
                    )


                    if response.status_code == 200:

                        print(
                            f'📄 GAS POST 回應: '
                            f'{response.text[:500]}'
                        )

                        return True


                    print(
                        f'⚠️ GAS POST HTTP '
                        f'{response.status_code}'
                    )


                except requests.exceptions.Timeout:

                    print(
                        '⏱️ GAS POST 逾時'
                    )


                except Exception as e:

                    print(
                        f'❌ GAS POST 錯誤: {e}'
                    )


                if attempt < max_attempts:

                    wait_seconds = attempt * 5

                    print(
                        f'⏳ {wait_seconds} 秒後重試...'
                    )

                    time.sleep(
                        wait_seconds
                    )


            return False


        # ============================================================
        # 初始化
        # ============================================================

        print(
            '=== 初始化 ==='
        )


        if not GAS_WEB_URL:

            message = (
                '❌ HSR_GAS_WEB_URL 未設定'
            )

            print(message)

            send_discord(message)

            sys.exit(1)


        if not ACCOUNTS_JSON:

            message = (
                '❌ HSR_ACCOUNTS_JSON 未設定'
            )

            print(message)

            send_discord(message)

            sys.exit(1)


        # ============================================================
        # Accounts
        # ============================================================

        try:

            user_accounts = json.loads(
                ACCOUNTS_JSON
            )


            if not isinstance(
                user_accounts,
                list
            ):

                raise ValueError(
                    'ACCOUNTS_JSON 必須是 JSON array'
                )


            print(
                f'✅ 成功讀取 '
                f'{len(user_accounts)} 組帳號資料。'
            )


        except Exception as e:

            message = (
                f'❌ 解析 ACCOUNTS_JSON 失敗: {e}'
            )

            print(message)

            send_discord(message)

            sys.exit(1)


        # ============================================================
        # 步驟 1：Google Sheet
        # ============================================================

        print()
        print(
            '=== 步驟 1: 從 Google 試算表讀取歷史紀錄 ==='
        )


        data = get_gas_data()


        if data is None:

            message = (
                '❌ 無法從 Google Apps Script '
                '取得歷史紀錄。\n\n'
                '可能原因：\n'
                '1. GAS 執行時間過久\n'
                '2. GAS Web App 暫時沒有回應\n'
                '3. Google Sheet 本身被鎖定\n'
                '4. GAS doGet() 程式發生錯誤\n'
                '5. Web App 部署版本不是最新版本'
            )


            print(message)

            send_discord(message)

            sys.exit(1)


        # ------------------------------------------------------------
        # 取得 sentCodes
        # ------------------------------------------------------------

        sent_codes = data.get(
            'sentCodes',
            []
        )


        if not isinstance(
            sent_codes,
            list
        ):

            print(
                '⚠️ GAS 回傳的 sentCodes '
                '不是 list，改成空清單。'
            )

            sent_codes = []


        sent_codes = {

            str(code)
            .strip()
            .upper()

            for code in sent_codes

            if str(code).strip()

        }


        print(
            f'📊 試算表歷史已記錄序號共 '
            f'{len(sent_codes)} 筆。'
        )


        # ============================================================
        # 步驟 2：爬取網站
        # ============================================================

        print()
        print(
            '=== 步驟 2: 爬取星穹鐵道網頁最新序號 ==='
        )


        scrape_headers = {

            'User-Agent': (
                'Mozilla/5.0 '
                '(Windows NT 10.0; Win64; x64) '
                'AppleWebKit/537.36 '
                '(KHTML, like Gecko) '
                'Chrome/120.0.0.0 '
                'Safari/537.36'
            ),

            'accept': (
                'text/html,application/xhtml+xml,'
                'application/xml;q=0.9,'
                'image/avif,image/webp,image/apng,'
                '*/*;q=0.8'
            ),

            'accept-language': (
                'zh-TW,zh;q=0.9,'
                'en-US;q=0.8,en;q=0.7'
            ),

            'cache-control': 'no-cache',

            'pragma': 'no-cache',

            'upgrade-insecure-requests': '1'
        }


        target_json_data = None


        try:

            response = requests.get(

                SCRAPE_URL,

                headers=scrape_headers,

                timeout=30

            )


            print(
                f'🌐 網頁 HTTP Status: '
                f'{response.status_code}'
            )


            if response.status_code != 200:

                print(
                    '❌ 網頁請求失敗'
                )

                sys.exit(1)


            soup = BeautifulSoup(

                response.text,

                'html.parser'

            )


            scripts = soup.find_all(
                'script'
            )


            print(
                f'🔎 找到 '
                f'{len(scripts)} 個 <script> 區塊。'
            )


            # ========================================================
            # 使用你已經驗證成功的 parser
            # ========================================================

            for script in scripts:

                script_text = (

                    script.string

                    or script.get_text()

                    or ''

                )


                if (
                    'initialCodes'
                    not in script_text
                ):
                    continue


                match = re.search(

                    r'self\.__next_f\.push'
                    r'\(\[\d+,\s*\"(.*)\"\s*\]\)',

                    script_text

                )


                if not match:

                    continue


                raw_str = (

                    match.group(1)

                    .replace(
                        '\\n',
                        ''
                    )

                )


                clean_str = (

                    raw_str

                    .replace(
                        '\\"',
                        '"'
                    )

                    .replace(
                        '"$undefined"',
                        'null'
                    )

                )


                try:

                    inner_match = re.search(

                        r'\{"initialCodes".*?\]\}',

                        clean_str

                    )


                    if inner_match:

                        actual_content = json.loads(

                            inner_match.group(0)

                        )


                        target_json_data = (

                            actual_content[
                                'initialCodes'
                            ]

                        )


                        break


                except Exception:

                    continue


        except Exception as e:

            print(
                f'❌ 爬取網頁發生異常: {e}'
            )

            sys.exit(1)


        # ============================================================
        # 檢查 initialCodes
        # ============================================================

        if not target_json_data:

            print(
                '❌ 無法從網頁中提取 initialCodes。'
            )

            print(
                f'📄 HTML 長度: '
                f'{len(response.text)}'
            )

            print(
                '📄 是否包含 initialCodes: '
                f'{"initialCodes" in response.text}'
            )

            sys.exit(1)


        # ============================================================
        # Code list
        # ============================================================

        code_list = []


        for item in target_json_data:

            if not isinstance(
                item,
                dict
            ):
                continue


            code = item.get(
                'code'
            )


            if code:

                code = str(
                    code
                ).strip().upper()


                if code:

                    code_list.append(
                        code
                    )


        code_list = list(
            dict.fromkeys(
                code_list
            )
        )


        print()
        print(
            f'🎉 成功取得 '
            f'{len(code_list)} 個兌換碼：'
        )


        for code in code_list:

            print(
                f'   🎁 {code}'
            )


        # ============================================================
        # 步驟 3：比對
        # ============================================================

        print()
        print(
            '=== 步驟 3: 比對新序號並批量執行兌換 ==='
        )


        new_codes = [

            code

            for code in code_list

            if code not in sent_codes

        ]


        if not new_codes:

            print(
                '👌 今天沒有新序號。'
            )


            send_discord(

                '👌 **崩壞：星穹鐵道每日排程檢查**\n'
                '今天沒有新序號。'

            )


            sys.exit(0)


        print(
            f'🔥 發現 {len(new_codes)} 個新序號：'
        )


        for code in new_codes:

            print(
                f'   🎁 {code}'
            )


        # ============================================================
        # 兌換
        # ============================================================

        dc_msg = (
            '🤖 **崩壞：星穹鐵道 '
            '自動序號兌換回報**\n'
        )


        for code in new_codes:

            print()
            print(
                '=' * 60
            )

            print(
                f'🎁 開始處理: {code}'
            )

            print(
                '=' * 60
            )


            success_cnt = 0
            already_cnt = 0
            fail_cnt = 0

            log_payloads = []


            for idx, acc in enumerate(
                user_accounts
            ):


                uid = str(
                    acc.get(
                        'uid',
                        ''
                    )
                ).strip()


                user_cookie = str(
                    acc.get(
                        'cookie',
                        ''
                    )
                ).strip()


                device_uuid = str(
                    acc.get(
                        'device_uuid',
                        ''
                    )
                ).strip()


                if not uid or not user_cookie:

                    print(
                        f'⚠️ 第 {idx + 1} 筆帳號缺少 '
                        'UID 或 Cookie，跳過。'
                    )

                    fail_cnt += 1

                    continue


                if idx > 0:

                    print(
                        '⏳ 等待 6 秒...'
                    )

                    time.sleep(6)


                headers = {

                    'accept': '*/*',

                    'accept-language': (
                        'zh-TW,zh;q=0.9,'
                        'en-US;q=0.8,en;q=0.7'
                    ),

                    'cache-control': 'no-cache',

                    'content-type':
                        'application/json',

                    'pragma': 'no-cache',

                    'cookie': user_cookie,

                    'Referer':
                        'https://hsr.hoyoverse.com/',

                    'User-Agent':
                        'Mozilla/5.0 '
                        '(Windows NT 10.0; Win64; x64) '
                        'AppleWebKit/537.36 '
                        '(KHTML, like Gecko) '
                        'Chrome/120.0 Safari/537.36'
                }


                payload = {

                    't':
                        int(
                            time.time() * 1000
                        ),

                    'lang':
                        'zh-tw',

                    'game_biz':
                        'hkrpg_global',

                    'uid':
                        uid,

                    'region':
                        'prod_official_asia',

                    'cdkey':
                        code,

                    'platform':
                        '4',

                    'device_uuid':
                        device_uuid
                }


                try:

                    res = requests.post(

                        EXCHANGE_API_URL,

                        headers=headers,

                        json=payload,

                        timeout=15

                    )


                    res_text = res.text


                    if res.status_code == 200:

                        try:

                            res_json = res.json()

                        except Exception:

                            res_json = {}


                        retcode = res_json.get(
                            'retcode',
                            -1
                        )


                        msg = str(
                            res_json.get(
                                'message',
                                ''
                            )
                        )


                        if retcode == 0:

                            success_cnt += 1

                            print(
                                f'✅ 帳號 {uid}: '
                                '兌換成功'
                            )


                        elif (

                            retcode == -2017

                            or 'already'
                            in msg.lower()

                        ):

                            already_cnt += 1

                            print(
                                f'ℹ️ 帳號 {uid}: '
                                '以前已領取'
                            )


                        else:

                            fail_cnt += 1

                            print(
                                f'❌ 帳號 {uid}: '
                                f'{retcode} / {msg}'
                            )


                    else:

                        fail_cnt += 1

                        print(
                            f'❌ 帳號 {uid}: '
                            f'HTTP {res.status_code}'
                        )


                    log_payloads.append({

                        'code':
                            code,

                        'userId':
                            uid,

                        'resCode':
                            res.status_code,

                        'resText':
                            res_text

                    })


                except Exception as err:

                    fail_cnt += 1

                    print(
                        f'❌ 帳號 {uid}: '
                        f'{err}'
                    )


                    log_payloads.append({

                        'code':
                            code,

                        'userId':
                            uid,

                        'resCode':
                            'Exception',

                        'resText':
                            str(err)

                    })


            # ========================================================
            # Discord summary
            # ========================================================

            dc_msg += (

                f'\n🎁 `{code}`\n'

                f'👥 帳號數: '
                f'**{len(user_accounts)}**\n'

                f'🎉 成功: '
                f'**{success_cnt}**\n'

                f'📝 已領取: '
                f'**{already_cnt}**\n'

                f'❌ 失敗: '
                f'**{fail_cnt}**\n'

            )


            # ========================================================
            # Google Sheet
            # ========================================================

            print()
            print(
                f'💾 寫入 Google Sheet: {code}'
            )


            code_ok = post_gas({

                'action':
                    'addCode',

                'code':
                    code

            })


            log_ok = post_gas({

                'action':
                    'addLog',

                'logs':
                    log_payloads

            })


            if code_ok:

                print(
                    '✅ addCode 成功'
                )

            else:

                print(
                    '❌ addCode 失敗'
                )


            if log_ok:

                print(
                    '✅ addLog 成功'
                )

            else:

                print(
                    '❌ addLog 失敗'
                )


        # ============================================================
        # Discord
        # ============================================================

        print()
        print(
            '=== 步驟 4: 發送 Discord 通知 ==='
        )


        send_discord(
            dc_msg
        )


        # ============================================================
        # Finish
        # ============================================================

        print()
        print(
            '🏁 全流程自動化整合執行完畢！'
        )

        EOF
