name: HSR Auto Coupon Pipeline

on:
  push:
    branches:
      - main

  schedule:
    # GitHub Actions 使用 UTC
    # 00:00 UTC = 台灣時間 08:00
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  hsr_pipeline:
    runs-on: ubuntu-latest

    steps:

    # ================================================================
    # 1. Checkout
    # ================================================================

    - name: Checkout repository
      uses: actions/checkout@v4


    # ================================================================
    # 2. Python
    # ================================================================

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'


    # ================================================================
    # 3. Dependencies
    # ================================================================

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4


    # ================================================================
    # 4. Main Pipeline
    # ================================================================

    - name: Scrape, Compare, Redeem and Log
      env:
        GAS_WEB_URL: ${{ secrets.HSR_GAS_WEB_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.HSR_DISCORD_WEBHOOK_URL }}
        ACCOUNTS_JSON: ${{ secrets.HSR_ACCOUNTS_JSON }}

      run: |
        python << 'EOF'

        import os
        import re
        import json
        import time
        import sys
        import requests
        from bs4 import BeautifulSoup


        # ============================================================
        # 基本設定
        # ============================================================

        GAS_WEB_URL = os.getenv(
            'GAS_WEB_URL',
            ''
        ).strip()

        DISCORD_WEBHOOK_URL = os.getenv(
            'DISCORD_WEBHOOK_URL',
            ''
        ).strip()

        ACCOUNTS_JSON = os.getenv(
            'ACCOUNTS_JSON',
            ''
        ).strip()


        SCRAPE_URL = (
            'https://www.crimsonwitch.com/'
            'codes/Honkai_Star_Rail'
        )


        EXCHANGE_API_URL = (
            'https://public-operation-hkrpg.hoyoverse.com/'
            'common/apicdkey/api/webExchangeCdkeyRisk'
        )


        # ============================================================
        # Discord 通知
        # ============================================================

        def send_discord(message):

            if not DISCORD_WEBHOOK_URL:
                return

            try:

                response = requests.post(
                    DISCORD_WEBHOOK_URL,
                    json={
                        'content': message
                    },
                    timeout=10
                )

                if response.status_code >= 400:

                    print(
                        f'⚠️ Discord HTTP '
                        f'{response.status_code}'
                    )

            except Exception as e:

                print(
                    f'⚠️ Discord 通知發送失敗: {e}'
                )


        # ============================================================
        # 初始化
        # ============================================================

        print('=== 初始化 ===')


        if not GAS_WEB_URL:

            message = (
                '❌ GitHub Secret '
                'HSR_GAS_WEB_URL 未設定。'
            )

            print(message)

            send_discord(message)

            sys.exit(1)


        if not ACCOUNTS_JSON:

            message = (
                '❌ GitHub Secret '
                'HSR_ACCOUNTS_JSON 未設定。'
            )

            print(message)

            send_discord(message)

            sys.exit(1)


        # ============================================================
        # 解析帳號
        # ============================================================

        try:

            user_accounts = json.loads(
                ACCOUNTS_JSON
            )

            if not isinstance(
                user_accounts,
                list
            ):
                raise ValueError(
                    'ACCOUNTS_JSON 必須是 JSON array'
                )

            print(
                f'✅ 成功讀取 '
                f'{len(user_accounts)} 組帳號資料。'
            )

        except Exception as e:

            message = (
                f'❌ 解析 ACCOUNTS_JSON 發生錯誤: {e}'
            )

            print(message)

            send_discord(message)

            sys.exit(1)


        # ============================================================
        # 步驟 1
        # Google Sheet 歷史紀錄
        # ============================================================

        print()
        print(
            '=== 步驟 1: 從 Google 試算表讀取歷史紀錄 ==='
        )


        try:

            gas_res = requests.get(
                GAS_WEB_URL,
                params={
                    'action': 'getData'
                },
                timeout=15
            )

            gas_res.raise_for_status()

            data = gas_res.json()

            sent_codes = data.get(
                'sentCodes',
                []
            )

            if not isinstance(
                sent_codes,
                list
            ):
                sent_codes = []


            # 統一格式
            sent_codes = {
                str(code).strip().upper()
                for code in sent_codes
                if str(code).strip()
            }


            print(
                f'📊 試算表歷史已記錄序號共 '
                f'{len(sent_codes)} 筆。'
            )


        except Exception as e:

            message = (
                f'❌ 讀取 Google 試算表歷史紀錄失敗: '
                f'{e}'
            )

            print(message)

            send_discord(message)

            sys.exit(1)


        # ============================================================
        # 步驟 2
        # 抓取最新兌換碼
        #
        # 注意：
        # 這裡刻意使用你「已經測試成功」的 parser。
        # 不再改成其他 initialCodes parser。
        # ============================================================

        print()
        print(
            '=== 步驟 2: 爬取星穹鐵道網頁最新序號 ==='
        )


        scrape_headers = {

            'User-Agent': (
                'Mozilla/5.0 '
                '(Windows NT 10.0; Win64; x64) '
                'AppleWebKit/537.36 '
                '(KHTML, like Gecko) '
                'Chrome/120.0.0.0 '
                'Safari/537.36'
            ),

            'accept': (
                'text/html,application/xhtml+xml,'
                'application/xml;q=0.9,'
                'image/avif,image/webp,image/apng,'
                '*/*;q=0.8,'
                'application/signed-exchange;'
                'v=b3;q=0.7'
            ),

            'accept-language': (
                'zh-TW,zh;q=0.9,'
                'en-US;q=0.8,en;q=0.7'
            ),

            'cache-control': 'no-cache',

            'pragma': 'no-cache',

            'priority': 'u=0, i',

            'upgrade-insecure-requests': '1'
        }


        target_json_data = None


        try:

            print(
                f'🌐 開始請求: {SCRAPE_URL}'
            )


            response = requests.get(
                SCRAPE_URL,
                headers=scrape_headers,
                timeout=20
            )


            print(
                f'🌐 網頁 HTTP Status: '
                f'{response.status_code}'
            )


            if response.status_code != 200:

                message = (
                    f'❌ 網頁請求失敗，'
                    f'HTTP {response.status_code}'
                )

                print(message)

                send_discord(message)

                sys.exit(1)


            # --------------------------------------------------------
            # 建立 BeautifulSoup
            # --------------------------------------------------------

            soup = BeautifulSoup(
                response.text,
                'html.parser'
            )


            scripts = soup.find_all(
                'script'
            )


            print(
                f'🔎 找到 '
                f'{len(scripts)} 個 <script> 區塊。'
            )


            # --------------------------------------------------------
            # 使用已驗證成功的 initialCodes parser
            # --------------------------------------------------------

            for script in scripts:

                script_text = (
                    script.string
                    or script.get_text()
                    or ''
                )


                if (
                    'initialCodes'
                    not in script_text
                ):
                    continue


                print(
                    '🔍 找到包含 initialCodes '
                    '的 script。'
                )


                # ----------------------------------------------------
                # Next.js self.__next_f.push
                # ----------------------------------------------------

                match = re.search(
                    r'self\.__next_f\.push'
                    r'\(\[\d+,\s*\"(.*)\"\s*\]\)',
                    script_text
                )


                if not match:

                    continue


                raw_str = (
                    match.group(1)
                    .replace('\\n', '')
                )


                clean_str = (
                    raw_str
                    .replace('\\"', '"')
                    .replace(
                        '"$undefined"',
                        'null'
                    )
                )


                try:

                    inner_match = re.search(
                        r'\{"initialCodes".*?\]\}',
                        clean_str
                    )


                    if inner_match:

                        actual_content = json.loads(
                            inner_match.group(0)
                        )


                        target_json_data = (
                            actual_content[
                                'initialCodes'
                            ]
                        )


                        print(
                            '✅ 成功提取 initialCodes！'
                        )


                        break


                except Exception as e:

                    print(
                        f'⚠️ 解析此 script 失敗: {e}'
                    )

                    continue


        except Exception as e:

            message = (
                f'❌ 爬取網頁發生異常: {e}'
            )

            print(message)

            send_discord(message)

            sys.exit(1)


        # ============================================================
        # 確認抓取結果
        # ============================================================

        if not target_json_data:

            message = (
                '❌ 錯誤：無法從網頁中提取 '
                '`initialCodes` 資料。\n'
                f'目標網址: {SCRAPE_URL}'
            )

            print(message)


            # Debug 資訊
            print(
                f'📄 HTML 長度: '
                f'{len(response.text)}'
            )

            print(
                '📄 是否包含 initialCodes: '
                f'{"initialCodes" in response.text}'
            )


            send_discord(message)

            sys.exit(1)


        # ============================================================
        # 顯示完整抓取結果
        # ============================================================

        print()
        print(
            '🎉 【成功提取資料】'
        )


        print(
            json.dumps(
                target_json_data,
                indent=4,
                ensure_ascii=False
            )
        )


        # ============================================================
        # 整理 code
        # ============================================================

        code_list = []


        for item in target_json_data:

            if not isinstance(
                item,
                dict
            ):
                continue


            raw_code = item.get(
                'code'
            )


            if raw_code is None:
                continue


            code = str(
                raw_code
            ).strip().upper()


            if code:

                code_list.append(
                    code
                )


        # 去除重複
        code_list = list(
            dict.fromkeys(
                code_list
            )
        )


        print()
        print(
            '--- 🌟 兌換碼快速總覽 ---'
        )


        for item in target_json_data:

            if not isinstance(
                item,
                dict
            ):
                continue


            code = item.get(
                'code',
                ''
            )


            rewards = item.get(
                'rewards',
                ''
            )


            print(
                f'兌換碼: {code} '
                f'| 獎勵: {rewards}'
            )


        print(
            '------------------------'
        )


        print()
        print(
            f'🎯 總共取得 '
            f'{len(code_list)} 個兌換碼。'
        )


        # ============================================================
        # 步驟 3
        # 比對歷史紀錄
        # ============================================================

        print()
        print(
            '=== 步驟 3: 比對新序號並批量執行兌換 ==='
        )


        new_codes = [

            code

            for code in code_list

            if code not in sent_codes

        ]


        if not new_codes:

            print(
                '👌 檢查完畢：'
                '所有序號都已經存在歷史紀錄。'
            )


            send_discord(
                '👌 **崩壞：星穹鐵道每日排程檢查**\n'
                '今天沒有新序號。'
            )


            sys.exit(0)


        print()
        print(
            f'🔥 發現 '
            f'{len(new_codes)} 個新的未記錄序號：'
        )


        for code in new_codes:

            print(
                f'   🎁 {code}'
            )


        # ============================================================
        # Discord 訊息
        # ============================================================

        dc_msg = (
            '🤖 **崩壞：星穹鐵道 '
            '自動序號兌換回報**\n'
        )


        # ============================================================
        # 步驟 3
        # 每個新序號
        # ============================================================

        for code in new_codes:

            code = code.strip().upper()


            print()
            print(
                '=' * 60
            )

            print(
                f'🎁 開始處理序號: {code}'
            )

            print(
                '=' * 60
            )


            dc_msg += (
                f'\n🎁 發現新序號: `{code}`\n'
            )


            success_cnt = 0

            already_cnt = 0

            fail_cnt = 0

            log_payloads = []


            # ========================================================
            # 每個帳號
            # ========================================================

            for idx, acc in enumerate(
                user_accounts
            ):


                if not isinstance(
                    acc,
                    dict
                ):

                    print(
                        f'⚠️ 第 {idx + 1} 筆帳號資料格式錯誤，'
                        '跳過。'
                    )

                    fail_cnt += 1

                    continue


                uid = str(
                    acc.get(
                        'uid',
                        ''
                    )
                ).strip()


                user_cookie = str(
                    acc.get(
                        'cookie',
                        ''
                    )
                ).strip()


                device_uuid = str(
                    acc.get(
                        'device_uuid',
                        ''
                    )
                ).strip()


                # ----------------------------------------------------
                # 檢查 UID / Cookie
                # ----------------------------------------------------

                if (
                    not uid
                    or not user_cookie
                ):

                    print(
                        f'⚠️ 第 {idx + 1} 筆資料缺少 '
                        'UID 或 Cookie，跳過。'
                    )

                    fail_cnt += 1

                    continue


                # ----------------------------------------------------
                # 帳號間冷卻
                # ----------------------------------------------------

                if idx > 0:

                    print(
                        '⏳ 切換帳號，'
                        '等待 6 秒...'
                    )

                    time.sleep(6)


                # ----------------------------------------------------
                # API Headers
                # ----------------------------------------------------

                api_headers = {

                    'accept': '*/*',

                    'accept-language': (
                        'zh-TW,zh;q=0.9,'
                        'en-US;q=0.8,en;q=0.7'
                    ),

                    'cache-control': 'no-cache',

                    'content-type': (
                        'application/json'
                    ),

                    'pragma': 'no-cache',

                    'cookie': user_cookie,

                    'Referer': (
                        'https://hsr.hoyoverse.com/'
                    ),

                    'User-Agent': (
                        'Mozilla/5.0 '
                        '(Windows NT 10.0; Win64; x64) '
                        'AppleWebKit/537.36 '
                        '(KHTML, like Gecko) '
                        'Chrome/120.0.0.0 '
                        'Safari/537.36'
                    )
                }


                # ----------------------------------------------------
                # Payload
                # ----------------------------------------------------

                current_timestamp = int(
                    time.time() * 1000
                )


                payload = {

                    't': current_timestamp,

                    'lang': 'zh-tw',

                    'game_biz': 'hkrpg_global',

                    'uid': uid,

                    'region': 'prod_official_asia',

                    'cdkey': code,

                    'platform': '4',

                    'device_uuid': device_uuid

                }


                # ----------------------------------------------------
                # 呼叫兌換 API
                # ----------------------------------------------------

                try:

                    res = requests.post(

                        EXCHANGE_API_URL,

                        headers=api_headers,

                        json=payload,

                        timeout=15

                    )


                    res_text = res.text


                    print(
                        f'📡 帳號 {uid}: '
                        f'HTTP {res.status_code}'
                    )


                    if res.status_code == 200:

                        try:

                            res_json = res.json()

                        except ValueError:

                            res_json = {}

                            print(
                                '⚠️ API 回傳不是 JSON'
                            )


                        retcode = res_json.get(
                            'retcode',
                            -1
                        )


                        msg = str(
                            res_json.get(
                                'message',
                                ''
                            )
                        )


                        # ------------------------------------------------
                        # 成功
                        # ------------------------------------------------

                        if retcode == 0:

                            success_cnt += 1

                            print(
                                f'✅ 帳號 {uid}: '
                                '兌換成功！'
                            )


                        # ------------------------------------------------
                        # 已經領取
                        # ------------------------------------------------

                        elif (
                            retcode == -2017
                            or 'already'
                            in msg.lower()
                        ):

                            already_cnt += 1

                            print(
                                f'ℹ️ 帳號 {uid}: '
                                '以前就已經領取過'
                            )


                        # ------------------------------------------------
                        # 其他失敗
                        # ------------------------------------------------

                        else:

                            fail_cnt += 1

                            print(
                                f'❌ 帳號 {uid} 失敗 '
                                f'(retcode: {retcode}, '
                                f'msg: {msg})'
                            )


                    else:

                        fail_cnt += 1

                        print(
                            f'❌ 帳號 {uid} 請求失敗 '
                            f'(HTTP {res.status_code})'
                        )


                    # --------------------------------------------------
                    # Log
                    # --------------------------------------------------

                    log_payloads.append({

                        'code': code,

                        'userId': uid,

                        'resCode': res.status_code,

                        'resText': res_text

                    })


                except Exception as err:

                    fail_cnt += 1

                    print(
                        f'❌ 帳號 {uid} '
                        f'連線異常: {err}'
                    )


                    log_payloads.append({

                        'code': code,

                        'userId': uid,

                        'resCode': 'Exception',

                        'resText': str(err)

                    })


            # ========================================================
            # 本序號結果
            # ========================================================

            dc_msg += (
                f'   ➔ 👥 帳號憑證總數: '
                f'**{len(user_accounts)}** 組\n'
            )

            dc_msg += (
                f'   ➔ 🎉 新成功: '
                f'**{success_cnt}**\n'
            )

            dc_msg += (
                f'   ➔ 📝 以前已領過: '
                f'**{already_cnt}**\n'
            )

            dc_msg += (
                f'   ➔ ❌ 失敗: '
                f'**{fail_cnt}**\n'
            )


            # ========================================================
            # 寫入 Google Sheet
            # ========================================================

            print()
            print(
                f'💾 正在將紀錄同步寫回 Google 試算表 '
                f'({code})...'
            )


            try:

                add_code_response = requests.post(

                    GAS_WEB_URL,

                    json={
                        'action': 'addCode',
                        'code': code
                    },

                    timeout=10

                )


                print(
                    f'   addCode HTTP: '
                    f'{add_code_response.status_code}'
                )


                add_log_response = requests.post(

                    GAS_WEB_URL,

                    json={
                        'action': 'addLog',
                        'logs': log_payloads
                    },

                    timeout=10

                )


                print(
                    f'   addLog HTTP: '
                    f'{add_log_response.status_code}'
                )


            except Exception as sheet_err:

                print(
                    f'⚠️ Google 試算表寫入失敗: '
                    f'{sheet_err}'
                )


        # ============================================================
        # 步驟 4
        # Discord
        # ============================================================

        print()
        print(
            '=== 步驟 4: 發送 Discord 通知 ==='
        )


        if DISCORD_WEBHOOK_URL:

            try:

                discord_response = requests.post(

                    DISCORD_WEBHOOK_URL,

                    json={
                        'content': dc_msg
                    },

                    timeout=10

                )


                if discord_response.status_code < 400:

                    print(
                        '✅ 兌換通知已成功送至 Discord。'
                    )

                else:

                    print(
                        f'❌ Discord HTTP '
                        f'{discord_response.status_code}'
                    )


            except Exception as e:

                print(
                    f'❌ Discord 通知發送失敗: {e}'
                )

        else:

            print(
                'ℹ️ 未設定 Discord Webhook，'
                '略過通知。'
            )


        # ============================================================
        # 完成
        # ============================================================

        print()
        print(
            '🏁 全流程自動化整合執行完畢！'
        )

        EOF
