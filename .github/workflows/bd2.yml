name: BD2 Coupon Automation

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: # 允許手動點擊執行測試

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      env:
        X_API_KEY: ${{ secrets.X_API_KEY }}
        GAS_WEB_URL: ${{ secrets.GAS_WEB_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        cat << 'EOF' > run.py
        import os, requests, json, sys

        def clean_secret(val):
            if not val: return ""
            return val.strip().strip('\\').strip("'").strip('"').strip()

        X_API_KEY = clean_secret(os.getenv('X_API_KEY', ''))
        
        headers_a = {
            'accept': '*/*',
            'accept-language': 'zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7,zh-CN;q=0.6',
            'cache-control': 'no-cache',
            'content-type': 'application/json',
            'origin': 'https://thebd2pulse.com',
            'pragma': 'no-cache',
            'referer': 'https://thebd2pulse.com',
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36',
            'x-api-key': X_API_KEY
        }

        print('🔍 === 【A-API 照妖鏡測試模式】 === 🔍\n')

        # 🧪 測試 A：使用 GET 請求
        print('👉 嘗試 1：使用 [GET] 方式呼叫 A-API...')
        try:
            res_get = requests.get('https://thebd2pulse.com', headers=headers_a, timeout=10)
            print(f'   ➔ 回應狀態碼: {res_get.status_code}')
            print(f'   ➔ 回傳真實內容 (前200字): 【{res_get.text.strip()}】\n')
        except Exception as e:
            print(f'   ➔ [GET] 發生連線異常: {e}\n')

        # 🧪 測試 B：使用 POST 請求（帶空 Body）
        print('👉 嘗試 2：使用 [POST] 方式呼叫 A-API...')
        try:
            res_post = requests.post('https://thebd2pulse.com', headers=headers_a, json={}, timeout=10)
            print(f'   ➔ 回應狀態碼: {res_post.status_code}')
            print(f'   ➔ 回傳真實內容 (前200字): 【{res_post.text.strip()}】\n')
        except Exception as e:
            print(f'   ➔ [POST] 發生連線異常: {e}\n')

        print('🏁 測試探測完畢，強制結束，等待比對結果。')
        sys.exit(0)
        EOF
        python run.py
